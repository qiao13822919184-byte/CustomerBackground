name: Deploy to configured server
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo 'Configure DEPLOY_HOST first'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'Configure DEPLOY_USER first'; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo 'Configure DEPLOY_SSH_KEY first'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Configure verified SSH host fingerprint first'; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Pull, start HTTPS stack, and verify public endpoint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/customer-background && git pull --ff-only && sh deploy/production.sh'
